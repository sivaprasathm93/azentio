services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SENTINEL_ANALYST_USER: ${SENTINEL_ANALYST_USER}
      SENTINEL_ANALYST_PASSWORD: ${SENTINEL_ANALYST_PASSWORD}
      SENTINEL_SUPERVISOR_USER: ${SENTINEL_SUPERVISOR_USER}
      SENTINEL_SUPERVISOR_PASSWORD: ${SENTINEL_SUPERVISOR_PASSWORD}
      SENTINEL_ADMIN_USER: ${SENTINEL_ADMIN_USER}
      SENTINEL_ADMIN_PASSWORD: ${SENTINEL_ADMIN_PASSWORD}
      SENTINEL_DETECTION_THREADS: ${SENTINEL_DETECTION_THREADS:-8}
    ports:
      - "8080:8080"

volumes:
  pgdata:
